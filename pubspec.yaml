name: school_carpool
description: >-
  Free, non-profit app that lets verified parents in Egypt share school runs.
publish_to: none

# Bumped by CI (build number comes from TestFlight / Codemagic).
version: 0.1.0+1

environment:
  # Dart 3.13 (needed by material_ui) ships with Flutter 3.50. Material comes
  # from the `material_ui` package: it was published with Flutter 3.47 and
  # the in-SDK `package:flutter/material.dart` is formally deprecated in 3.50.
  sdk: ^3.13.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  material_ui: ^1.6.0

  # State and navigation
  flutter_riverpod: ^3.0.0
  go_router: ^18.0.0

  # Firebase (FlutterFire 2026 major line: Firebase iOS SDK 13, Android BoM 35)
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  firebase_storage: ^14.0.0
  cloud_functions: ^7.0.0
  firebase_messaging: ^17.0.0
  firebase_app_check: ^0.5.0

  # Errors (Sentry 10: Swift Package Manager only on iOS, Android minSdk 26)
  sentry_flutter: ^10.0.0

  # Localization. Version is pinned by flutter_localizations, so `any`.
  intl: any

  # Identity verification (Prompt 3, justified in docs/progress/prompt-03.md).
  # Official camera plugin (flutter.dev): our own preview and overlay, camera
  # only, no gallery picker. Uses CameraX on Android, AVFoundation on iOS.
  camera: ^0.12.2
  # Native JPEG compression on the phone; drops EXIF (location) by default.
  flutter_image_compress: ^2.5.1
  # Screenshot and screen-recording blocking on document screens:
  # FLAG_SECURE on Android, the secure text field layer on iOS.
  screen_protector: ^1.5.3

  # Maps (Prompt 5, justified in docs/progress/prompt-05.md). Official
  # Flutter plugin: Google Maps SDK on iPhone (CocoaPods) and Android, Maps
  # JavaScript on the web (google_maps_flutter_web, endorsed).
  google_maps_flutter: ^2.17.0
  # One-shot "use my current location" for the home pin, while the app is
  # in use only. Live location during runs stays with
  # flutter_background_geolocation (Prompt 13).
  geolocator: ^14.0.2

  # Invite links (Prompt 6, F31; justified in docs/progress/prompt-06.md).
  # Official flutter.dev plugin: opens https://wa.me so the parent shares a
  # carpool link in WhatsApp. Java/Swift (no Kotlin fix needed).
  url_launcher: ^6.3.1

  # Critical alerts (Prompt 8, spec section 11; justified in
  # docs/progress/prompt-08.md): the app's own alarm, a local notification
  # with sound ("time sensitive" on iPhone) scheduled at the alert's alarm
  # time and cancelled when the parent opens it. The standard Flutter
  # plugin for local notifications; free. Java/Swift (no Kotlin fix); on
  # Android it needs core library desugaring (tool/patch_native.py).
  flutter_local_notifications: ^19.4.0
  # Time zone type for scheduling the alarm above (we schedule in UTC, so
  # no time zone database is loaded). Same author's package the plugin
  # already depends on.
  timezone: ^0.10.0

  # Chat (Prompt 9, F8 to F10, F13; justified in docs/progress/prompt-09.md).
  # Stream Chat's official Flutter SDK, UI-free layer: client, channel list
  # controller and offline send queue. Our own screens from the design
  # system (stream_chat_flutter's UI kit still imports the deprecated
  # in-SDK Material library, whose types do not match material_ui).
  stream_chat_flutter_core: ^10.7.0
  # Stream's offline storage (SQLite via drift): chats open offline and a
  # message written offline is kept and sent when back online.
  stream_chat_persistence: ^10.7.0
  # Official flutter.dev plugin: take or choose a photo for a private or
  # carpool chat (EXIF removed by flutter_image_compress before upload).
  image_picker: ^1.2.2
  # Live location during runs (Prompt 10, F15; in the STACK list:
  # "flutter_background_geolocation (paid license)"). Transistor Software.
  # Keeps sending with the phone locked, uploads points itself (HTTP to the
  # tripLocation function) and runs only while a run is on. Version 5
  # (compound config). Debug builds need no licence; release builds need
  # the v5 JWT licence on iPhone AND Android (BG_GEO_LICENSE, SETUP.md
  # section 20.5; never committed).
  flutter_background_geolocation: ^5.9.2

  # Persists the language, theme mode and dev design direction on the phone.
  # Official Flutter plugin; flagged to the owner in docs/progress/prompt-01.md.
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  # Fonts are bundled, not fetched at runtime (see docs/progress/prompt-01.md).
  fonts:
    # Direction A
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700
    # Direction B
    - family: Tajawal
      fonts:
        - asset: assets/fonts/tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/tajawal/Tajawal-Bold.ttf
          weight: 700
