name: school_carpool
description: >-
  Free, non-profit app that lets verified parents in Egypt share school runs.
publish_to: none

# Bumped by CI (build number comes from TestFlight / Codemagic).
version: 0.1.0+1

environment:
  # Flutter 3.47+ ships Material as the separate `material_ui` package; the
  # in-SDK `package:flutter/material.dart` is deprecated. Current stable is
  # 3.50.0 (Nov 2026).
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  material_ui: ^1.6.0

  # State and navigation
  flutter_riverpod: ^3.0.0
  go_router: ^18.0.0

  # Firebase (FlutterFire 2026 major line: Firebase iOS SDK 13, Android BoM 35)
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  firebase_storage: ^14.0.0
  cloud_functions: ^7.0.0
  firebase_messaging: ^17.0.0
  firebase_app_check: ^0.5.0

  # Errors (Sentry 10: Swift Package Manager only on iOS, Android minSdk 26)
  sentry_flutter: ^10.0.0

  # Localization. Version is pinned by flutter_localizations, so `any`.
  intl: any

  # Persists the language, theme mode and dev design direction on the phone.
  # Official Flutter plugin; flagged to the owner in docs/progress/prompt-01.md.
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true

  # Fonts are bundled, not fetched at runtime (see docs/progress/prompt-01.md).
  fonts:
    # Direction A
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700
    # Direction B
    - family: Tajawal
      fonts:
        - asset: assets/fonts/tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/tajawal/Tajawal-Bold.ttf
          weight: 700
