# The plugin has no lint package of its own (no extra dependency); the
# app's rules that matter here are listed by hand.
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - directives_ordering
    - type_annotate_public_apis
    - unawaited_futures
