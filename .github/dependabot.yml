# Security review (16 Nov 2026): Dependabot version and security updates.
# Pull requests only; the checks workflow runs on main and by hand, so
# these PRs use no Actions minutes until someone starts the checks on one.
# Owner: switch on "Dependabot alerts" and "Dependabot security updates"
# in GitHub (docs/security/owner-actions.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 5
    groups:
      firebase:
        patterns: ["firebase-*", "@sentry/*"]
  - package-ecosystem: npm
    directory: /tests/rules
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
