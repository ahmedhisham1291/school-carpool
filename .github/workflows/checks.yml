# Checks on every push (owner decision, Prompt 1 review): analyze, tests,
# screenshots, Cloud Functions tests, rules tests on the Firebase emulators,
# and web/Android compile checks. iOS builds stay on Codemagic (macOS).
#
# Cost: free for public repositories; private repositories get a monthly
# allowance of free Linux minutes (docs/COSTS.md).
# Actions are pinned to commit SHAs (tag in the comment) so a moved tag
# cannot change what runs.
name: checks

# Minutes budget (owner, 14 Nov 2026): the monthly Actions allowance is
# nearly used, so:
# - docs-only pushes don't run anything (paths-ignore);
# - feature branches run analyze, tests and the backend tests only;
# - screenshots and the web/admin/Android builds run on main, on tags,
#   or when started by hand (Actions > checks > Run workflow, full=true).
# - update_locks=true (by hand, on a work branch) runs only the "locks" job,
#   which writes and commits the package lock files; no checks run then.
on:
  # Owner (14 Nov 2026): no paid Actions minutes. Pushes run checks only on
  # main; feature branches run only when started by hand
  # (gh workflow run checks.yml --ref <branch> -f full=false).
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      full:
        description: "Also run screenshots and the web/admin/Android builds"
        type: boolean
        default: false
      # Package versions are locked (docs/WORKFLOW.md "Package versions").
      # update_locks=true runs ONLY the "locks" job: it writes the lock files
      # and commits them to the branch the run was started on. Never on main.
      update_locks:
        description: "Only write and commit the lock files to this branch (no checks)"
        type: boolean
        default: false
      upgrade_packages:
        description: "With update_locks: also move every package to the newest version the manifests allow"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep equal to `flutter:` in codemagic.yaml: pubspec.lock is made with this
  # version (docs/WORKFLOW.md, "Package versions").
  FLUTTER_VERSION: "3.50.0"

jobs:
  flutter:
    name: Flutter analyze, tests and screenshots
    if: ${{ !inputs.update_locks }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Security review: the token is not left in .git/config, where
          # package install scripts could read it.
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Bootstrap (native folders, packages, localizations)
        run: FLAVOR=dev tool/bootstrap.sh
      - name: flutter analyze
        run: flutter analyze
      - name: flutter test
        run: flutter test --reporter expanded
      - name: Screenshots (AR/EN, light/dark, directions A/B)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.full
        run: flutter test test/screenshots --update-goldens --reporter expanded
      - name: Upload screenshots
        if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.full)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screenshots
          path: test/screenshots/goldens/
          if-no-files-found: warn
          retention-days: 30

      # Fail fast: one failed job cancels the rest of the run (saves minutes).
      - name: Cancel the other jobs when this one fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  builds:
    name: Web, admin panel and Android compile (staging)
    if: ${{ !inputs.update_locks && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.full) }}
    runs-on: ubuntu-latest
    # Android release builds take 15-25 minutes on a cold runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Security review: the token is not left in .git/config, where
          # package install scripts could read it.
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          # Caches ~/.gradle (wrapper and dependencies) between runs.
          cache: gradle
          cache-dependency-path: |
            pubspec.yaml
            pubspec.lock
            tool/patch_native.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Bootstrap (staging ids)
        run: FLAVOR=staging tool/bootstrap.sh
      - name: Build web
        run: flutter build web --release -t lib/main_staging.dart
      - name: Build admin panel (web, Prompt 4)
        run: |
          flutter build web --release -t lib/admin/main_admin_staging.dart
          rm -rf build/admin_web && mv build/web build/admin_web
      - name: Build Android APK (debug-signed until Stage 3)
        run: flutter build apk --release -t lib/main_staging.dart

      # Fail fast: one failed job cancels the rest of the run (saves minutes).
      - name: Cancel the other jobs when this one fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  backend:
    name: Cloud Functions tests and rules tests (emulators)
    if: ${{ !inputs.update_locks }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Security review: the token is not left in .git/config, where
          # package install scripts could read it.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache npm and emulator downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.npm
            ~/.cache/firebase/emulators
          key: npm-${{ runner.os }}-${{ hashFiles('functions/package*.json', 'tests/rules/package*.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Cloud Functions build and unit tests
        run: |
          # Exactly the locked versions once functions/package-lock.json is
          # committed (the "locks" job); plain install until then.
          if [ -f functions/package-lock.json ]; then
            npm ci --prefix functions --no-audit --no-fund
          else
            echo "::warning::functions/package-lock.json is not committed yet: versions are not locked (run the locks job)."
            npm install --prefix functions --no-audit --no-fund
          fi
          npm test --prefix functions
      - name: Known vulnerabilities in the Cloud Functions packages (report only)
        # Security review: npm audit against the advisory database. Report
        # only (a new advisory must not block unrelated work); Dependabot
        # alerts and PRs carry the fixes (.github/dependabot.yml).
        continue-on-error: true
        run: npm audit --prefix functions --omit=dev --audit-level=high
      - name: Cloud Functions tests on the emulators (user record, parent ID)
        run: |
          npx --yes firebase-tools@15 emulators:exec --only firestore,auth \
            --project demo-school-carpool "npm --prefix functions run test:emulator"
      - name: Build tools (invite links site, native patches)
        run: python3 -m unittest discover -s tool -p 'test_*.py' -v
      - name: Schools import (Python tests, sample data, load twice into the emulator)
        run: |
          python3 -m unittest discover -s tools/import_schools -v
          python3 tools/import_schools/import_schools.py --input data/schools/sample
          npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-school-carpool \
            "npm --prefix functions run schools:load:emulator && npm --prefix functions run schools:load:emulator > /tmp/second_load.txt"
          cat /tmp/second_load.txt
          # The second load of the same file must write nothing.
          grep -q "new: 0, changed: 0" /tmp/second_load.txt
      - name: Firestore and Storage rules tests on the emulators
        run: |
          if [ -f tests/rules/package-lock.json ]; then
            npm ci --prefix tests/rules --no-audit --no-fund
          else
            echo "::warning::tests/rules/package-lock.json is not committed yet: versions are not locked (run the locks job)."
            npm install --prefix tests/rules --no-audit --no-fund
          fi
          npx --yes firebase-tools@15 emulators:exec --only firestore,storage \
            --project demo-school-carpool "npm --prefix tests/rules test"

      # Fail fast: one failed job cancels the rest of the run (saves minutes).
      - name: Cancel the other jobs when this one fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # Manual only: writes the lock files and commits them to the branch the
  # run was started on (docs/WORKFLOW.md "Package versions"). This cloud
  # workspace has no pub.dev or npm access, so the files are made here.
  #   gh workflow run checks.yml --ref <branch> -f update_locks=true
  # A push made with the workflow token starts no other workflow, so start
  # the checks on the branch by hand afterwards.
  locks:
    name: Write and commit the package lock files (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_locks }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      BRANCH: ${{ github.ref_name }}
      REF_TYPE: ${{ github.ref_type }}
      UPGRADE: ${{ inputs.upgrade_packages }}
    steps:
      - name: Only on a work branch
        run: |
          if [ "$REF_TYPE" != "branch" ] || [ "$BRANCH" = "main" ]; then
            echo "::error::Start this job on a work branch (not main, not a tag); review the lock file diff, then merge."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Start from scratch (upgrade_packages only)
        if: ${{ inputs.upgrade_packages }}
        run: |
          rm -f pubspec.lock packages/run_recovery/pubspec.lock \
            functions/package-lock.json tests/rules/package-lock.json
      - name: Dart and Flutter packages (pubspec.lock)
        run: |
          # Keeps the versions already in a lock file; adds what is missing.
          # Native folders are not needed to resolve packages.
          flutter pub get
          (cd packages/run_recovery && flutter pub get)
      - name: Node packages (package-lock.json)
        run: |
          # No node_modules here, so the lock lists the optional packages of
          # every platform (sharp: Linux for Cloud Functions, macOS for a Mac).
          (cd functions && npm install --package-lock-only --no-audit --no-fund)
          (cd tests/rules && npm install --package-lock-only --no-audit --no-fund)
      - name: Commit and push the lock files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock packages/run_recovery/pubspec.lock \
            functions/package-lock.json tests/rules/package-lock.json
          if git diff --cached --quiet; then
            echo "The lock files already match the manifests. Nothing to commit."
            exit 0
          fi
          git diff --cached --stat
          if [ "$UPGRADE" = "true" ]; then
            MESSAGE="Packages: upgrade to the newest allowed versions (lock files)"
          else
            MESSAGE="Packages: write the lock files (pubspec.lock, package-lock.json)"
          fi
          git commit -m "$MESSAGE" \
            -m "Made by the locks job of checks.yml with Flutter ${FLUTTER_VERSION} and Node 22. Review the diff, then run the checks on this branch."
          git push origin "HEAD:refs/heads/${BRANCH}"
