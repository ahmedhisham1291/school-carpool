# Checks on every push (owner decision, Prompt 1 review): analyze, tests,
# screenshots, Cloud Functions tests, rules tests on the Firebase emulators,
# and web/Android compile checks. iOS builds stay on Codemagic (macOS).
#
# Cost: free for public repositories; private repositories get a monthly
# allowance of free Linux minutes (docs/COSTS.md).
# Actions are pinned to commit SHAs (tag in the comment) so a moved tag
# cannot change what runs.
name: checks

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  flutter:
    name: Flutter analyze, tests and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Bootstrap (native folders, packages, localizations)
        run: FLAVOR=dev tool/bootstrap.sh
      - name: flutter analyze
        run: flutter analyze
      - name: flutter test
        run: flutter test --reporter expanded
      - name: Screenshots (AR/EN, light/dark, directions A/B)
        run: flutter test test/screenshots --update-goldens --reporter expanded
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screenshots
          path: test/screenshots/goldens/
          if-no-files-found: warn
          retention-days: 30

  builds:
    name: Web and Android compile (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Bootstrap (staging ids)
        run: FLAVOR=staging tool/bootstrap.sh
      - name: Build web
        run: flutter build web --release -t lib/main_staging.dart
      - name: Build Android APK (debug-signed until Stage 3)
        run: flutter build apk --release -t lib/main_staging.dart

  backend:
    name: Cloud Functions tests and rules tests (emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache npm and emulator downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.npm
            ~/.cache/firebase/emulators
          key: npm-${{ runner.os }}-${{ hashFiles('functions/package*.json', 'tests/rules/package*.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Cloud Functions build and unit tests
        run: |
          npm install --prefix functions --no-audit --no-fund
          npm test --prefix functions
      - name: Cloud Functions tests on the emulators (user record, parent ID)
        run: |
          npx --yes firebase-tools@15 emulators:exec --only firestore,auth \
            --project demo-school-carpool "npm --prefix functions run test:emulator"
      - name: Firestore and Storage rules tests on the emulators
        run: |
          npm install --prefix tests/rules --no-audit --no-fund
          npx --yes firebase-tools@15 emulators:exec --only firestore,storage \
            --project demo-school-carpool "npm --prefix tests/rules test"
